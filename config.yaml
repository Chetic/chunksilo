# ChunkSilo configuration
# All options and their defaults: chunksilo --dump-defaults

# What to index - used by: chunksilo --build-index
indexing:
  directories:
    - "./data"
  # chunk_size: 512
  # chunk_overlap: 50

  ## Per-directory defaults (applied to every directory unless overridden per entry)
  # defaults:
  #   include: ["**/*.pdf", "**/*.md", "**/*.txt", "**/*.docx", "**/*.doc"]
  #   exclude:
  #     - "**/.git/**"
  #     - "**/node_modules/**"
  #     - "**/__pycache__/**"
  #     - "**/.venv/**"
  #     - "**/venv/**"
  #     - "**/.tox/**"
  #     - "**/.mypy_cache/**"
  #     - "**/.pytest_cache/**"
  #     - "**/.eggs/**"
  #     - "**/*.egg-info/**"
  #     - "**/.DS_Store"
  #   recursive: true
  #   case_sensitive: false

  ## Performance
  # batch_size: 200               # embedding batch size (adapts down under memory pressure)
  # parallel_workers: 8           # 1 = load files serially
  # checkpoint_interval_files: 500
  # checkpoint_interval_seconds: 300

  ## Timeouts, in seconds
  # per_file_seconds: 300         # give up on a single file after this long (0 disables)
  # scan_item_seconds: 30         # stat/hash/walk operations while scanning

  ## Diagnostics
  # slow_file_threshold_seconds: 30   # warn when one file takes longer than this

# Confluence integration (optional) - enables live search of Confluence pages
# Installed by default; set the values below to enable.
confluence:
  url: ""
  username: ""
  api_token: ""
  # timeout: 10.0
  # max_results: 30

# Jira integration (optional) - enables live search of Jira issues
# Installed by default; set the values below to enable.
jira:
  # Jira base URL (leave empty to disable)
  # Cloud: https://company.atlassian.net
  # Server: https://jira.company.com
  url: ""

  # Username (Cloud: email, Server: username)
  username: ""

  # API token (create at id.atlassian.com/manage-profile/security/api-tokens)
  api_token: ""

  # timeout: 10.0
  # max_results: 30

  # Project keys to search ([] = all accessible projects)
  # Example: ["PROJ", "ENG"]
  # projects: []

  # include_comments: false       # slower but more comprehensive
  # include_custom_fields: false   # rarely useful for semantic search

# SSL/TLS settings - for corporate environments with custom CA certificates
ssl:
  # ca_bundle_path: ""

# Retrieval settings - control search quality and speed
retrieval:
  # offline: false  # set to true after models are downloaded to prevent network requests
  # embed_model_name: "BAAI/bge-small-en-v1.5"
  # embed_top_k: 20
  # rerank_model_name: "ms-marco-MiniLM-L-12-v2"
  # rerank_top_k: 5
  # rerank_candidates: 100
  # score_threshold: 0.1
  # recency_boost: 0.3
  # recency_half_life_days: 365

# Storage paths
storage:
  storage_dir: "./storage"
  model_cache_dir: "./models"
